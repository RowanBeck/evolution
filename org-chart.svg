    <line x1="895" y1="470" x2="1225" y2="470" stroke="#fb7185"/>
    <line x1="895" y1="470" x2="895" y2="510" stroke="#fb7185"/>
    <line x1="1005" y1="470" x2="1005" y2="510" stroke="#fb7185"/>
