    <line x1="340" y1="470" x2="340" y2="510" stroke="#22d3ee"/>
    <line x1="450" y1="470" x2="450" y2="510" stroke="#22d3ee"/>
    <line x1="560" y1="470" x2="560" y2="510" stroke="#22d3ee"/>
