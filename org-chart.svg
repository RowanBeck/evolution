    <line x1="640" y1="470" x2="760" y2="470" stroke="#34d399"/>
    <line x1="640" y1="470" x2="640" y2="510" stroke="#34d399"/>
    <line x1="760" y1="470" x2="760" y2="510" stroke="#34d399"/>
