    <line x1="700" y1="290" x2="340" y2="290" stroke="#22d3ee"/>
    <line x1="340" y1="290" x2="340" y2="345" stroke="#22d3ee"/>
    <line x1="700" y1="290" x2="700" y2="345" stroke="#34d399"/>
