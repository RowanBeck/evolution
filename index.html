<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindflow — Team & Evolution</title>
<style>
body{margin:0;background:#0f1117;color:#e1e4eb;font-family:-apple-system,sans-serif}
nav{padding:1rem 2rem;display:flex;gap:1.5rem;border-bottom:1px solid #2a2e3d}
nav a{color:#818cf8;text-decoration:none;font-size:.9rem;font-weight:500}
nav a:hover{color:#a5b4fc}
nav a.active{color:#e1e4eb;border-bottom:2px solid #6366f1;padding-bottom:4px}
.frame{width:100%;height:calc(100vh - 60px);border:none}
</style>
</head><body>
<nav>
  <a href="#" onclick="show('org')" id="nav-org" class="active">Org Chart</a>
  <a href="#" onclick="show('evo')" id="nav-evo">Evolution System</a>
</nav>
<img id="org" src="org-chart.svg" style="max-width:100%;padding:2rem;display:block;margin:0 auto" alt="Org Chart">
<img id="evo" src="diagram.svg" style="max-width:100%;padding:2rem;display:none;margin:0 auto" alt="Evolution System">
<script>
function show(id){
  document.getElementById('org').style.display = id==='org' ? 'block' : 'none';
  document.getElementById('evo').style.display = id==='evo' ? 'block' : 'none';
  document.getElementById('nav-org').className = id==='org' ? 'active' : '';
  document.getElementById('nav-evo').className = id==='evo' ? 'active' : '';
}
</script>
</body></html>
